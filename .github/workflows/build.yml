name: Build and check draft
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: draft-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Source checks and RFCXML build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned formatter and record the environment
        run: |
          mkdir -p build
          python -m pip install -r requirements.txt
          python -m pip freeze > build/environment.txt
      - name: Check source, frozen publication, and editorial tools
        run: make check test
      - name: Render with official xml2rfc and repeat in the same environment
        run: make build
      - name: Build editor site and pinned candidate previews
        run: |
          python tools/site.py --fetch-candidates
          make site
      - name: Preserve review site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: editor-site-${{ github.sha }}-${{ github.run_attempt }}
          path: _site/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare Pages deployment
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site/
      - name: Preserve public renderings and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: editor-build-${{ github.sha }}-${{ github.run_attempt }}
          path: build/
          if-no-files-found: error
          retention-days: 14
  deploy:
    name: Publish editor site
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
