name: Import exact published baseline (one-time setup)
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-public-baseline.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'MikhailSergeev369/draft-audit-task-requirements'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Import only the pinned public IETF files
        shell: bash
        run: |
          set -euo pipefail
          test ! -e draft-sergeev-audit-task-requirements.xml
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import urllib.request
          import time
          base = 'draft-sergeev-audit-task-requirements'
          expected = {
              'xml': 'e83c17d6a43fe66a010502655a94dae067195b36e9001f9f8de11e5fb164dc5a',
              'txt': '532a14ef7757cf68cce7ce77e4404810d1afc9bfe9926f2e5884fb353b3804f5',
          }
          archive = Path('published/00')
          archive.mkdir(parents=True, exist_ok=True)
          payloads = {}
          for ext, digest in expected.items():
              name = base + '-00.' + ext
              url = 'https://www.ietf.org/archive/id/' + name
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as response:
                          if response.status != 200:
                              raise RuntimeError('Non-200 IETF response')
                          data = response.read(2000001)
                      break
                  except OSError:
                      if attempt == 2:
                          raise
                      time.sleep(2)
              if len(data) > 2000000 or hashlib.sha256(data).hexdigest() != digest:
                  raise RuntimeError('Official bytes do not match pinned publication: ' + name)
              if (archive / name).exists():
                  raise RuntimeError('Refusing to replace an existing archived file')
              payloads[ext] = data
              print(name, len(data), digest)
          for ext, data in payloads.items():
              (archive / (base + '-00.' + ext)).write_bytes(data)
          Path(base + '.xml').write_bytes(payloads['xml'])
          PY
          python3 tools/draft.py review
          make check test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- draft-sergeev-audit-task-requirements.xml published/00/draft-sergeev-audit-task-requirements-00.xml published/00/draft-sergeev-audit-task-requirements-00.txt review/editor-copy.md
          git commit -m 'Import byte-verified IETF -00 and generate the reading copy'
          git push origin HEAD:main
