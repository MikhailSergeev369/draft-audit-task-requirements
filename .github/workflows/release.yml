name: Release a published IETF revision
on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Already published I-D revision (two digits, e.g. 00)'
        required: true
        default: '00'
        type: string
      target_commit:
        description: 'Full main-history commit SHA containing the exact source and published/NN snapshot'
        required: true
        type: string
      notes:
        description: 'Optional short summary of this revision'
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: ietf-release-${{ inputs.revision }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'MikhailSergeev369/draft-audit-task-requirements' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check the source and regression tests
        run: make check test
      - name: Verify the IETF archive, publish the GitHub release, and read back assets
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          NOTES: ${{ inputs.notes }}
        run: |
          python tools/release.py --revision="$REVISION" --commit="$TARGET_COMMIT" --notes="$NOTES" --publish
      - name: Preserve verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/
          if-no-files-found: warn
          retention-days: 14
